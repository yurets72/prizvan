<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест на призвание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#1E2A24;
    --paper:#F2ECD9;
    --paper-2:#E7DEC3;
    --ink:#2B2A21;
    --ink-muted:#6B6754;
    --accent:#B54B34;
    --accent-2:#7E8F6F;
    --gold:#B8862F;
    --line:rgba(43,42,33,0.2);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--canvas);
    background-image:radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 40%);
    padding:32px 16px;
    font-family:'Source Serif 4', serif;
    color:var(--ink);
  }
  .card{
    width:100%;
    max-width:560px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:2.25rem 2rem;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-muted);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:1.5rem;
  }
  .eyebrow::after{
    content:'';
    flex:1;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px);
  }
  .ticks{display:flex;gap:6px;margin-bottom:1.75rem}
  .tick{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .25s}
  .tick.on{background:var(--accent)}
  .qlabel{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 10px;
  }
  .qtext{font-size:19px;line-height:1.55;margin:0 0 1.5rem;color:var(--ink)}
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-bottom:1px dashed var(--line);
    padding:13px 2px;
    font-family:'Source Serif 4', serif;
    font-size:15.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .opt:last-child{border-bottom:none}
  .opt:hover, .opt:focus-visible{background:var(--paper-2)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .opt .arrow{margin-left:auto;opacity:0;color:var(--accent);transition:opacity .15s}
  .opt:hover .arrow, .opt:focus-visible .arrow{opacity:1}
  .badge{
    width:64px;height:64px;border-radius:50%;
    border:2px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-4deg);
    color:var(--accent);
    margin-bottom:14px;
  }
  .badge svg{width:30px;height:30px}
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .desc{font-size:16px;line-height:1.6;color:var(--ink);margin:0 0 4px}
  .dir{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.03em;
    color:var(--ink-muted);
    margin:0 0 1.75rem;
  }
  .bars{display:flex;flex-direction:column;gap:11px;margin-bottom:1.75rem}
  .barrow-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--ink)}
  .barrow-top span.lbl{display:flex;align-items:center;gap:7px}
  .barrow-top svg{width:15px;height:15px;color:var(--ink-muted)}
  .barrow-top .score{font-family:'IBM Plex Mono', monospace;color:var(--ink-muted);font-size:12px}
  .track{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
  .fill{height:100%;background:var(--accent-2)}
  .fill.top{background:var(--gold)}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:11px 16px;
    border-radius:4px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:480px){
    .card{padding:1.75rem 1.25rem}
    h1{font-size:24px}
    .qtext{font-size:17px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Тест на призвание</div>
  <div class="ticks" id="ticks"></div>
  <div id="body"></div>
</div>
<script>
var ICON = {
  teach:'<path d="M4 19V6a2 2 0 0 1 2-2h5v16H6a2 2 0 0 0-2 2"/><path d="M20 19V6a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2"/>',
  care:'<path d="M12 20s-7-4.35-9.4-8.4C.9 8 2.1 4.6 5.5 4.1c2-.3 3.7.8 4.5 2.2C10.8 4.9 12.5 3.8 14.5 4.1c3.4.5 4.6 3.9 3 7.5C19 15.65 12 20 12 20z"/>',
  protect:'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/>',
  heal:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  create:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6h5.4c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/>',
  guide:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-5 2 2-5z"/>'
};
function svg(key, size){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:'+size+'px;height:'+size+'px">'+ICON[key]+'</svg>';
}
var AR = {
  teach:{label:'Учитель', desc:'Тебе важно передать знание так, чтобы человек сам разобрался дальше.', dir:'менторство, преподавание, обучающий контент'},
  care:{label:'Хранитель', desc:'Твой первый порыв — согреть и быть рядом в моменте.', dir:'работа с людьми напрямую, комьюнити, забота как призвание'},
  protect:{label:'Защитник', desc:'Ты встаёшь между человеком и угрозой, берёшь удар на себя.', dir:'право, безопасность, защита чужих интересов'},
  heal:{label:'Целитель', desc:'Ты сразу видишь, что болит, и идёшь чинить — физически или морально.', dir:'медицина, терапия, реставрация, коучинг'},
  create:{label:'Творец', desc:'Там, где другие теряются, ты придумываешь нестандартный выход.', dir:'дизайн, стартапы, искусство, изобретательство'},
  guide:{label:'Проводник', desc:'Ты превращаешь хаос в понятный маршрут и ведёшь по нему.', dir:'менеджмент, кураторство проектов, планирование, консалтинг'}
};
var Q = [
  {t:'Новый человек в компании явно теряется и не понимает, как тут всё устроено. Твой первый порыв?', o:[['teach','Сесть рядом и на пальцах объяснить, как тут всё работает'],['care','Спросить, как он, и просто побыть рядом'],['guide','Взять его под крыло и провести чёткий маршрут — с чего начать'],['create','Сделать ему простую шпаргалку, чтобы освоился быстрее'],['protect','Поговорить с его руководителем — попросить дать ему больше времени'],['heal','Заметить, что он на нервах, и помочь выдохнуть']]},
  {t:'На остановке в незнакомом городе к тебе подходит растерянный турист с картой.', o:[['guide','Составить ему короткий план — что посмотреть и в каком порядке'],['teach','Подробно объяснить дорогу, чтобы он сам смог сориентироваться дальше'],['care','Проводить его до места лично, заодно поговорить'],['protect','Предупредить, в какие районы лучше не соваться вечером'],['create','Нарисовать на салфетке понятную схему маршрута'],['heal','Заметить, что он в стрессе от города, и просто успокоить']]},
  {t:'Друг завёл первый бизнес и в панике — ничего не идёт по плану.', o:[['heal','Помочь ему выдохнуть и не сгореть от стресса'],['guide','Составить чёткий пошаговый план на ближайший месяц'],['teach','Разложить по полочкам, что вообще происходит и почему'],['create','Придумать вместе нестандартный выход из ситуации'],['protect','Взять на себя разговор с проблемным партнёром'],['care','Просто выслушать и напомнить, что он справится']]},
  {t:'Незнакомый человек в сети пишет, что потерял работу и не знает, что делать.', o:[['create','Подкинуть нестандартную идею — смену сферы, свой проект'],['teach','Поделиться рабочими лайфхаками поиска работы'],['care','Написать просто «держись, ты не один»'],['guide','Помочь составить конкретный план на ближайшие две недели'],['protect','Предложить подключить свои связи'],['heal','Спросить, как он справляется морально, и правда выслушать']]},
  {t:'В компании на природе кто-то поранился — небольшая, но неприятная травма.', o:[['heal','Сразу заняться раной — обработать, перевязать'],['protect','Взять ситуацию под контроль, организовать помощь'],['care','Обнять, успокоить, быть рядом'],['create','Придумать, как соорудить шину из подручных средств'],['guide','Чётко распределить, кто за чем бежит'],['teach','Потом объяснить всем, как правильно оказывать первую помощь']]},
  {t:'Тебе достаётся заброшенный, но красивый парк, где всё запущено.', o:[['create','Придумать то, чего тут раньше не было — арт-объект, фестиваль'],['heal','Восстановить то, что разрушено'],['guide','Продумать понятный маршрут для посетителей'],['protect','Позаботиться о безопасности — освещение, охрана'],['care','Сделать место уютным — лавочки, зелень'],['teach','Организовать экскурсии, рассказывать историю места']]}
];
var idx = 0, scores = {teach:0,care:0,protect:0,heal:0,create:0,guide:0};

function renderTicks(){
  var h = '';
  for(var i=0;i<Q.length;i++){ h += '<div class="tick'+(i<idx?' on':'')+'"></div>'; }
  document.getElementById('ticks').innerHTML = h;
}

function renderQ(){
  renderTicks();
  var q = Q[idx];
  var h = '<p class="qlabel">Вопрос '+(idx+1)+' из '+Q.length+'</p>';
  h += '<p class="qtext">'+q.t+'</p>';
  q.o.forEach(function(opt){
    h += '<button type="button" class="opt" data-k="'+opt[0]+'">'+opt[1]+'<span class="arrow">›</span></button>';
  });
  document.getElementById('body').innerHTML = h;
  document.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click', function(){
      scores[b.getAttribute('data-k')]++;
      idx++;
      if(idx < Q.length){ renderQ(); } else { renderResult(); }
    });
  });
}

function renderResult(){
  renderTicks();
  var order = Object.keys(scores).sort(function(a,b){ return scores[b]-scores[a]; });
  var top = order[0];
  var h = '<div class="badge">'+svg(top,30)+'</div>';
  h += '<h1>'+AR[top].label+'</h1>';
  h += '<p class="desc">'+AR[top].desc+'</p>';
  h += '<p class="dir">куда это ведёт — '+AR[top].dir+'</p>';
  h += '<div class="bars">';
  order.forEach(function(k){
    var pct = Math.round(scores[k] / Q.length * 100);
    h += '<div><div class="barrow-top"><span class="lbl">'+svg(k,15)+AR[k].label+'</span><span class="score">'+scores[k]+'/'+Q.length+'</span></div><div class="track"><div class="fill'+(k===top?' top':'')+'" style="width:'+pct+'%"></div></div></div>';
  });
  h += '</div>';
  h += '<div class="actions"><button type="button" class="btn" id="retake">Пройти заново</button></div>';
  document.getElementById('body').innerHTML = h;
  document.getElementById('retake').addEventListener('click', function(){
    idx = 0;
    scores = {teach:0,care:0,protect:0,heal:0,create:0,guide:0};
    renderQ();
  });
}

renderQ();
</script>
</body>
</html>
